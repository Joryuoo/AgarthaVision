config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    active: true
    threshold: 80
    ignoreAnnotated: ['Composable']

exceptions:
  SwallowedException:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**']
  TooGenericExceptionCaught:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: false

style:
  ForbiddenImport:
    active: true
    imports:
      - 'android.util.Log'
    excludes: ['**/core/util/Logger.kt', '**/test/**', '**/androidTest/**']
  ForbiddenMethodCall:
    active: true
    methods:
      - 'android.util.Log.v'
      - 'android.util.Log.d'
      - 'android.util.Log.i'
      - 'android.util.Log.w'
      - 'android.util.Log.e'
      - 'android.util.Log.println'
      - 'kotlin.io.println'
      - 'kotlin.io.print'
      - 'kotlin.io.println(kotlin.Any?)'
      - 'kotlin.io.print(kotlin.Any?)'
    excludes: ['**/core/util/Logger.kt', '**/test/**', '**/androidTest/**']
  ForbiddenComment:
    active: false
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreAnnotated: ['Composable']
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']
  UnusedParameter:
    active: true
    ignoreAnnotated: ['Composable']
