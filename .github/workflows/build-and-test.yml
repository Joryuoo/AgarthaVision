name: build-and-test

on:
  pull_request:
  # Dispatch only AFTER a successful designated staging deployment.
  workflow_dispatch:
    inputs:
      deployed_revision:
        description: Exact revision confirmed deployed to the staging service
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name == 'pull_request'
    name: Android regression, API and localhost fake-model smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python -m pip install -r inference/requirements-test.txt
      # Compile/lint/APK + ONE full Roborazzi pass + API tests.
      - name: Required checks with structured evidence
        run: bun run check
      - name: Shared HTTP smoke against CI-started fake-model service
        if: ${{ !cancelled() }}
        run: bun run test:smoke --local
      - name: Preserve outcomes, logs, tested revision and screenshot differences
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-pr-${{ github.sha }}
          # Only the collector's redacted copies, never raw Gradle/Python output.
          path: build/qa/
          if-no-files-found: error
          retention-days: 14

  staging-smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Smoke confirmed staging deployment
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python -m pip install -r inference/requirements-test.txt
      - name: Shared required staging smoke
        env:
          QA_SMOKE_URL: ${{ vars.QA_SMOKE_URL }}
          QA_SMOKE_TOKEN: ${{ secrets.QA_SMOKE_TOKEN }}
          QA_DEPLOYED_REVISION: ${{ inputs.deployed_revision }}
        run: bun run test:smoke
      - name: Preserve deployed revision and smoke outcomes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-staging-${{ github.run_id }}
          path: build/qa/
          if-no-files-found: error
          retention-days: 14
