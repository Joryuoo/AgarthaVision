name: build-and-test

# Runs the unit test suite on every pull request, mirroring the
# :app:verifyRoborazziDebug check that already runs in the Husky pre-commit hook.
on:
  pull_request:

# Cancel superseded runs when a PR is updated with new commits.
concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests + screenshot verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and screenshot verification
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7
